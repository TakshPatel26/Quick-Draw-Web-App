<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Draw Web App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">

  <!--
    TensorFlow.js: powers the local DoodleNet CNN used for recognition.
    Vendored locally (vendor/tf.min.js) so the app works even when a CDN
    (jsdelivr/unpkg/cdnjs) is blocked by a network/firewall/ad-blocker —
    which is the most common cause of "Could not load the model" errors.
    tf-loader.js falls back to a CDN copy only if the local file is ever
    missing or fails to load for some other reason.
  -->
  <script src="tf-loader.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Quick Draw Web App</h1>
    <button id="show-sketch-btn" class="btn btn-info" data-toggle="modal" data-target="#sketchModal">Show Examples</button>
  </header>

  <div id="sketchModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-close" id="modal-close">&times;</span>
        <h4 class="modal-title">Sketches</h4>
      </div>
      <div class="modal-body">
        <img src="Quick Draw Web App 1.png" alt="Sketch example 1">
        <img src="Quick Draw Web App 2.png" alt="Sketch example 2">
      </div>
    </div>
  </div>

  <main class="app-main">
    <section class="prompt-panel">
      <p id="model-status" class="model-status">Loading recognition model…</p>
      <p class="sketch-word-label">Draw:
        <span id="sketch-word" class="sketch-word">…</span>
      </p>
      <div class="hud">
        <span id="score" class="hud-item">Score: 0</span>
        <span id="timer" class="hud-item">Time: 30</span>
      </div>
    </section>

    <section class="canvas-panel">
      <canvas id="draw-canvas" width="350" height="350"></canvas>
      <div id="result-banner" class="result-banner"></div>
      <div class="controls">
        <label class="brush-label">
          Brush size
          <input type="range" id="brush-size" min="4" max="24" value="12">
        </label>
        <button id="clear-btn" class="btn btn-secondary">Clear</button>
        <button id="skip-btn" class="btn btn-secondary">Skip Word</button>
      </div>
    </section>

    <section class="predictions-panel">
      <h3>AI's guesses</h3>
      <div id="predictions" class="predictions"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Powered by a real Quick, Draw! CNN (DoodleNet, 345 categories) running 100% locally in your browser via TensorFlow.js.</p>
  </footer>

  <script>
    // Minimal modal open/close (no Bootstrap/jQuery dependency needed anymore).
    document.addEventListener("DOMContentLoaded", function () {
      var modal = document.getElementById("sketchModal");
      var openBtn = document.getElementById("show-sketch-btn");
      var closeBtn = document.getElementById("modal-close");
      openBtn.addEventListener("click", function () { modal.classList.add("open"); });
      closeBtn.addEventListener("click", function () { modal.classList.remove("open"); });
      modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.remove("open"); });
    });
  </script>
  <script src="main.js"></script>
</body>
</html>
